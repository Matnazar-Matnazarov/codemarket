{% extends "base.html" %}
{% load compress static %}
{% block content %}
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800"></body>
    <!-- Filter Button -->
    <button onclick="toggleFilterSidebar()"
        class="fixed bottom-6 right-6 z-50 bg-purple-600 text-white p-4 rounded-full shadow-lg hover:bg-purple-700 transition-all duration-300"
        aria-label="Open filters">
        <i class="fas fa-filter"></i>
    </button>

    <!-- Filter Sidebar -->
    <div id="filter-sidebar"
        class="fixed top-0 right-0 w-80 h-screen bg-white dark:bg-gray-800 transform translate-x-full transition-transform duration-300 ease-in-out shadow-lg z-50 overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800 dark:text-white">Filters</h2>
                <button onclick="toggleFilterSidebar()"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300"
                    aria-label="Close filters">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Programming Technology Filter -->
            <div class="mb-6">
                <h3 class="font-semibold text-gray-700 dark:text-gray-300 mb-3">Programming Technology</h3>
                <div class="space-y-2" id="language-filters">
                    {% for technology in technologies %}
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" class="form-checkbox text-purple-600" value="{{ technology }}">
                        <span class="dark:text-gray-300">{{ technology }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- Upload Date Filter -->
            <div class="mb-6">
                <h3 class="font-semibold text-gray-700 dark:text-gray-300 mb-3">Upload Date</h3>
                <div class="space-y-2">
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="upload-date" value="24h" class="form-radio text-purple-600">
                        <span class="dark:text-gray-300">Last 24 hours</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="upload-date" value="7d" class="form-radio text-purple-600">
                        <span class="dark:text-gray-300">Last week</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="upload-date" value="30d" class="form-radio text-purple-600">
                        <span class="dark:text-gray-300">Last month</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="upload-date" value="365d" class="form-radio text-purple-600">
                        <span class="dark:text-gray-300">Last year</span>
                    </label>
                </div>
            </div>

            <!-- Apply Filters Button -->
            <button onclick="applyFilters()"
                class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-2 rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all duration-300">
                Apply Filters
            </button>
        </div>
    </div>

    <!-- Filter Overlay -->
    <div id="filter-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleFilterSidebar()">
    </div>

    <!-- Main Content -->
    <main class="md:ml-0 min-h-screen pt-16 md:pt-20 pb-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div
                class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm rounded-2xl shadow-xl p-6 sm:p-8 hover:shadow-2xl transition-all duration-300 border border-gray-100 dark:border-gray-700">
                <h1
                    class="text-2xl sm:text-3xl font-bold text-center mb-8 bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                    Our Products</h1>

                <div class="flex flex-wrap justify-center gap-3 sm:gap-4 mb-8">
                    <button id="all-btn" onclick="filterByCategory('all')"
                        class="category-btn px-4 sm:px-6 py-2 rounded-full bg-purple-600 text-white hover:bg-purple-700 transition-all duration-300 text-sm sm:text-base shadow-md hover:shadow-lg transform hover:-translate-y-0.5">All</button>
                    <button id="new-btn" onclick="filterByCategory('new')"
                        class="category-btn px-4 sm:px-6 py-2 rounded-full bg-purple-50 dark:bg-gray-700 text-purple-600 dark:text-purple-400 hover:bg-purple-100 dark:hover:bg-gray-600 transition-all duration-300 text-sm sm:text-base">New</button>
                    <button id="popular-btn" onclick="filterByCategory('popular')"
                        class="category-btn px-4 sm:px-6 py-2 rounded-full bg-purple-50 dark:bg-gray-700 text-purple-600 dark:text-purple-400 hover:bg-purple-100 dark:hover:bg-gray-600 transition-all duration-300 text-sm sm:text-base">Popular</button>
                </div>

                <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Products will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </main>

    {% compress js %}
    <script src="{% static 'js/card_and_filter.js' %}"></script>
    {% endcompress %}
</body>
{% endblock %}
