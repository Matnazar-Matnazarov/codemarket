<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi Loyiha Qo'shildi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .project-info {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .footer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Yangi Loyiha Qo'shildi</h2>
        <p>Hurmatli {{ user }}, yangi loyiha tizimga muvaffaqiyatli qo'shildi!</p>
    </div>

    <div class="project-info">
        <h3>Loyiha ma'lumotlari:</h3>
        <p><strong>Loyiha nomi:</strong> {{ project.name }}</p>
        <p><strong>Tavsif:</strong> {{ project.description }}</p>
        <p><strong>Yaratilgan sana:</strong> {{ project.created_at|date:"d.m.Y H:i" }}</p>
    </div>

    <div class="footer">
        <p>Bu avtomatik xabar. Iltimos, javob bermang.</p>
    </div>
</body>
</html>
