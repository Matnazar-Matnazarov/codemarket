version: '3.8'

services:
  web:
    build: .
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - celery
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/CodeMarket
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    networks:
      - codemarket_network
      
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=CodeMarket
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codemarket_network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codemarket_network

  celery:
    build: .
    command: celery -A config worker -l INFO
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/CodeMarket
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    networks:
      - codemarket_network

networks:
  codemarket_network:
    driver: bridge

volumes:
  postgres_data: