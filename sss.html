<div class="items-center hidden space-x-8 md:flex">
    <!-- Laboratoriya Menu -->
    <div class="relative group">
        <button class="flex items-center px-3 py-2 space-x-2 text-sm font-medium text-gray-700 transition-colors duration-300 rounded-lg menu-item dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400">
            <span>Laboratoriya</span>
            <svg class="w-4 h-4 transition-transform duration-300 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div class="absolute left-0 z-50 invisible w-64 mt-2 transition-all duration-300 transform -translate-y-3 opacity-0 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0">
            <div class="p-3 bg-white shadow-xl dark:bg-slate-700 rounded-xl ring-1 ring-black/5 backdrop-blur-sm">
                <div class="space-y-2">
                    <a href="{% url 'lobaratoriya1'%}" class="flex items-center px-4 py-3 text-sm text-gray-700 transition-all duration-300 transform rounded-lg dark:text-gray-200 hover:bg-gradient-to-r hover:from-blue-50/90 hover:to-purple-50/90 dark:hover:bg-slate-600/90 hover:translate-x-2">
                        <i class="mr-3 text-blue-500 fas fa-flask"></i>
                        <span>Laboratoriya 1</span>
                    </a>
                    <a href="{% url 'solishtirish'%}" class="flex items-center px-4 py-3 text-sm text-gray-700 transition-all duration-300 transform rounded-lg dark:text-gray-200 hover:bg-gradient-to-r hover:from-blue-50/90 hover:to-purple-50/90 dark:hover:bg-slate-600/90 hover:translate-x-2">
                        <i class="mr-3 text-purple-500 fas fa-vial"></i>
                        <span>Laboratoriya 2</span>
                    </a>
                    <a href="{% url 'sanoq_sistema'%}" class="flex items-center px-4 py-3 text-sm text-gray-700 transition-all duration-300 transform rounded-lg dark:text-gray-200 hover:bg-gradient-to-r hover:from-blue-50/90 hover:to-purple-50/90 dark:hover:bg-slate-600/90 hover:translate-x-2">
                        <i class="mr-3 text-indigo-500 fas fa-microscope"></i>
                        <span>Laboratoriya 3</span>
                    </a>
                    <a href="{% url 'video'%}" class="flex items-center px-4 py-3 text-sm text-gray-700 transition-all duration-300 transform rounded-lg dark:text-gray-200 hover:bg-gradient-to-r hover:from-blue-50/90 hover:to-purple-50/90 dark:hover:bg-slate-600/90 hover:translate-x-2">
                        <i class="mr-3 text-pink-500 fas fa-atom"></i>
                        <span>Laboratoriya 4</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Menu -->
    {% if request.user.is_superuser %}
    <div class="relative group">
        <button class="flex items-center px-3 py-2 space-x-2 text-sm font-medium text-gray-700 transition-colors duration-300 rounded-lg menu-item dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400">
            <span>Admin</span>
            <svg class="w-4 h-4 transition-transform duration-300 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div class="absolute left-0 z-50 invisible w-56 mt-2 transition-all duration-300 transform -translate-y-3 opacity-0 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0">
            <div class="p-3 bg-white shadow-xl dark:bg-slate-700 rounded-xl ring-1 ring-black/5 backdrop-blur-sm">
                <div class="space-y-2">
                    <a href="{% url 'addvideo'%}" class="flex items-center px-4 py-3 text-sm text-gray-700 transition-all duration-300 transform rounded-lg dark:text-gray-200 hover:bg-gradient-to-r hover:from-blue-50/90 hover:to-purple-50/90 dark:hover:bg-slate-600/90 hover:translate-x-2">
                        <i class="mr-3 text-blue-500 fas fa-video"></i>
                        <span>Video qo'shish</span>
                    </a>
                    <a href="{% url 'addtovar'%}" class="flex items-center px-4 py-3 text-sm text-gray-700 transition-all duration-300 transform rounded-lg dark:text-gray-200 hover:bg-gradient-to-r hover:from-blue-50/90 hover:to-purple-50/90 dark:hover:bg-slate-600/90 hover:translate-x-2">
                        <i class="mr-3 text-purple-500 fas fa-plus-circle"></i>
                        <span>Tovar qo'shish</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
    <button id="theme-toggle" class="p-2 text-gray-500 transition-all duration-300 transform rounded-lg dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-600 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800 hover:scale-110">
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
        </svg>
    </button>

    {% if request.user.is_authenticated %}
    <a href="{% url 'logout'%}" class="px-4 py-2 text-sm font-medium text-gray-700 transition-all duration-300 transform rounded-lg menu-item dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400 hover:scale-105">Chiqish</a>
    {% else %}
    <a href="{% url 'login'%}" class="relative inline-flex items-center px-6 py-2 overflow-hidden text-sm font-medium text-white transition-all duration-300 transform rounded-lg group bg-gradient-to-br from-blue-600 via-purple-600 to-pink-600 hover:from-blue-700 hover:via-purple-700 hover:to-pink-700 focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800 hover:scale-105">
        <span class="relative">Kirish</span>
    </a>
    {% endif %}
</div>
