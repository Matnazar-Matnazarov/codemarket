{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="min-h-screen px-4 pb-12 pt-28 md:pt-24">
  <div class="max-w-md mx-auto">
    <div class="p-6 space-y-6 transition-all duration-300 transform border border-gray-100 shadow-xl bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm rounded-2xl sm:p-8 hover:-translate-y-1 hover:shadow-2xl dark:border-gray-700">
      <div class="space-y-3 text-center">
        <h1 class="text-xl font-bold text-transparent sm:text-2xl md:text-3xl bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text">
          Welcome Back</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400 md:text-base">Please enter your details to sign in</p>
      </div>

      <form method="post" class="space-y-5" action="{% url 'login' %}{% if request.GET.next and request.GET.next != '' %}?next={{ request.GET.next }}{% endif %}">
        {% csrf_token %}
        <div class="relative group">
          <i class="absolute text-gray-400 transition-colors duration-300 -translate-y-1/2 fas fa-user left-3 top-1/2 group-focus-within:text-purple-600" aria-hidden="true"></i>
          <input type="text" name="username" 
            class="w-full pl-10 pr-4 py-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all duration-300 bg-white/80 dark:bg-gray-700/80 text-gray-900 dark:text-gray-100 text-sm md:text-base"
            placeholder="Email address" required>
        </div>

        <div class="relative group">
          <i class="absolute text-gray-400 transition-colors duration-300 -translate-y-1/2 fas fa-lock left-3 top-1/2 group-focus-within:text-purple-600" aria-hidden="true"></i>
          <input type="password" name="password"
            class="w-full pl-10 pr-12 py-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all duration-300 bg-white/80 dark:bg-gray-700/80 text-gray-900 dark:text-gray-100 text-sm md:text-base"
            placeholder="Password" required>
          <button type="button" onclick="togglePassword(this)"
            class="absolute p-1 text-gray-400 transition-colors duration-300 -translate-y-1/2 rounded-lg right-3 top-1/2 hover:text-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-600/20">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>

        <div class="flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-center sm:gap-0">
          <label class="flex items-center space-x-2 text-gray-600 cursor-pointer dark:text-gray-400 group">
            <input type="checkbox" name="remember"
              class="w-4 h-4 text-purple-600 transition-colors duration-300 border-gray-300 rounded dark:border-gray-600 focus:ring-purple-500/20">
            <span class="text-sm transition-colors duration-300 group-hover:text-purple-600 md:text-base">Remember me</span>
          </label>
          <a href="#"
            class="px-3 py-2 text-sm font-medium text-purple-600 transition-all duration-300 rounded-lg hover:text-purple-700 hover:bg-purple-50 dark:hover:bg-gray-700 md:text-base">Forgot Password?</a>
        </div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:from-purple-700 hover:to-blue-700 focus:ring-4 focus:ring-purple-500/50 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 text-sm md:text-base">
          Sign In
        </button>



        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 text-gray-500 bg-white dark:bg-gray-800 dark:text-gray-400">or continue with</span>
          </div>
        </div>

        <a href="#"
          class="w-full flex items-center justify-center space-x-2 border-2 border-gray-200 dark:border-gray-700 rounded-lg py-2.5 px-4 hover:bg-gray-50 dark:hover:bg-gray-700 hover:border-purple-600/20 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 text-sm md:text-base">
          <img src="{% static 'images/google.png' %}" class="w-5 h-5 transition-transform group-hover:scale-110" alt="Google">
          <span class="text-gray-700 dark:text-gray-300">Sign in with Google</span>
        </a>

        <p class="text-sm text-center text-gray-600 dark:text-gray-400 md:text-base">
          Don't have an account?
          <a href="#"
            class="inline-block px-3 py-2 ml-1 font-semibold text-purple-600 transition-all duration-300 rounded-lg hover:text-purple-700 hover:bg-purple-50 dark:hover:bg-gray-700">Sign up</a>
        </p>
      </form>
    </div>
  </div>
</main>
<script>
function togglePassword(button) {
  const input = button.parentElement.querySelector('input');
  const icon = button.querySelector('i');
  
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  }
}
</script>

{% endblock %}
