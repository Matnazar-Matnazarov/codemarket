{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="min-h-screen pt-28 md:pt-24 pb-12 px-4 bg-gray-50 dark:bg-gray-900">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm rounded-2xl shadow-xl p-6 sm:p-8 space-y-8 transform transition-all duration-300 hover:shadow-2xl border border-gray-100 dark:border-gray-700">
      <div class="text-center space-y-3">
        <h1 class="text-xl sm:text-2xl md:text-3xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
          Change Password
        </h1>
        <p class="text-gray-600 dark:text-gray-400 text-sm md:text-base">Please enter your current and new password</p>
      </div>

      <form method="post" class="space-y-5">
        {% csrf_token %}
        <div class="relative group">
          <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-purple-600 transition-colors duration-300"></i>
          <input type="password" name="old_password" id="id_old_password"
            class="w-full pl-10 pr-12 py-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all duration-300 bg-white/80 dark:bg-gray-700/80 text-gray-900 dark:text-gray-100"
            placeholder="Current Password" required>
          <button type="button" onclick="togglePassword(this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-600 transition-colors duration-300">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>

        <div class="relative group">
          <i class="fas fa-key absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-purple-600 transition-colors duration-300"></i>
          <input type="password" name="new_password" id="id_new_password"
            class="w-full pl-10 pr-12 py-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all duration-300 bg-white/80 dark:bg-gray-700/80 text-gray-900 dark:text-gray-100"
            placeholder="New Password" required>
          <button type="button" onclick="togglePassword(this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-600 transition-colors duration-300">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>

        <div class="relative group">
          <i class="fas fa-key absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-purple-600 transition-colors duration-300"></i>
          <input type="password" name="confirm_new_password" id="id_confirm_new_password"
            class="w-full pl-10 pr-12 py-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all duration-300 bg-white/80 dark:bg-gray-700/80 text-gray-900 dark:text-gray-100"
            placeholder="Confirm New Password" required>
          <button type="button" onclick="togglePassword(this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-600 transition-colors duration-300">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>

        <div class="flex gap-4 pt-4">
          <a href="{% url 'profile' %}"
            class="flex-1 flex justify-center items-center px-6 py-2.5 border-2 border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-all duration-300">
            <i class="fas fa-times mr-2"></i>
            Cancel
          </a>
          <button type="submit"
            class="flex-1 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-2.5 px-6 rounded-lg hover:from-purple-700 hover:to-blue-700 focus:ring-4 focus:ring-purple-500/50 transition-all duration-300">
            <i class="fas fa-check mr-2"></i>
            Change Password
          </button>
        </div>
      </form>
    </div>
  </div>
</main>

<script>
function togglePassword(button) {
  const input = button.parentElement.querySelector('input');
  const icon = button.querySelector('i');
  
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  }
}
</script>
{% endblock %}
