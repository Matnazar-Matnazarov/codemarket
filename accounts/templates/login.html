<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeMarket - Login to your account">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="../static/css/login.css">
  <link rel="stylesheet" href="../static/css/mobil.css">
  <script src="../static/js/tailwinds.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <title>CodeMarket - Login</title>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        document.documentElement.className = savedTheme;
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
    }
</script>
  <script src="../static/js/dark_tool.js"></script>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen">
  <!-- Mobile menu overlay -->
  <div id="mobile-menu-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleMobileMenu()">
  </div>

  <header class="fixed top-0 left-0 right-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur-sm shadow-sm z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex-shrink-0">
          <a href="../templates/home.html"
            class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent hover:from-purple-700 hover:to-blue-700 transition-all"
            aria-label="CodeMarket Home">CodeMarket</a>
        </div>

        <!-- Mobile menu button -->
        <button type="button"
          class="lg:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-700 dark:text-gray-300 hover:text-purple-600 hover:bg-purple-50 dark:hover:bg-gray-800 focus:outline-none"
          aria-controls="mobile-menu" aria-expanded="false" onclick="toggleMobileMenu()">
          <span class="sr-only">Open main menu</span>
          <i class="fas fa-bars text-2xl"></i>
        </button>

        <!-- Desktop navigation -->
        <nav aria-label="Main navigation" class="hidden lg:block">
          <ul class="flex space-x-8 items-center">
            <li>
              <a href="../templates/home.html"
                class="flex items-center text-gray-700 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 hover:bg-purple-50 dark:hover:bg-gray-800 px-3 py-2 rounded-lg transition-all"
                aria-current="page">
                <i class="fas fa-home mr-2" aria-hidden="true"></i>
                <span>Home</span>
              </a>
            </li>
            <li>
              <a href="../templates/product.html"
                class="flex items-center text-gray-700 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 hover:bg-purple-50 dark:hover:bg-gray-800 px-3 py-2 rounded-lg transition-all">
                <i class="fas fa-store mr-2" aria-hidden="true"></i>
                <span>Products</span>
              </a>
            </li>
            <li>
              <a href="../templates/product_purchases.html"
                class="flex items-center text-gray-700 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 hover:bg-purple-50 dark:hover:bg-gray-800 px-3 py-2 rounded-lg transition-all">
                <i class="fas fa-shopping-cart mr-2" aria-hidden="true"></i>
                <span>Cart</span>
              </a>
            </li>
            <li>
              <a href="#"
                class="flex items-center text-gray-700 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 hover:bg-purple-50 dark:hover:bg-gray-800 px-3 py-2 rounded-lg transition-all">
                <i class="fas fa-info-circle mr-2" aria-hidden="true"></i>
                <span>About</span>
              </a>
            </li>
            <li>
              <button onclick="toggleDarkMode()"
                class="flex items-center text-gray-700 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 hover:bg-purple-50 dark:hover:bg-gray-800 px-3 py-2 rounded-lg transition-all"
                aria-label="Toggle dark mode">
                <i class="fas fa-moon dark:hidden" aria-hidden="true"></i>
                <i class="fas fa-sun hidden dark:block" aria-hidden="true"></i>
              </button>
            </li>
            <li>
              <a href="../templates/login.html"
                class="flex items-center text-white bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 font-medium px-4 py-2 rounded-lg transition-all">
                <i class="fas fa-sign-in-alt mr-2" aria-hidden="true"></i>
                <span>Login</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- Mobile menu -->
  <div id="mobile-menu"
    class="lg:hidden fixed inset-y-0 left-0 w-64 bg-white dark:bg-gray-900 transform -translate-x-full transition-transform duration-300 ease-in-out z-50">
    <div class="p-4 border-b dark:border-gray-700">
      <div class="flex items-center justify-between">
        <a href="../templates/home.html"
          class="text-xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">CodeMarket</a>
        <button onclick="toggleMobileMenu()"
          class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <a href="../templates/home.html"
        class="flex items-center px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-purple-50 dark:hover:bg-gray-800 rounded-lg">
        <i class="fas fa-home mr-3"></i>
        Home
      </a>
      <a href="../templates/product.html"
        class="flex items-center px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-purple-50 dark:hover:bg-gray-800 rounded-lg">
        <i class="fas fa-store mr-3"></i>
        Products
      </a>
      <a href="../templates/product_purchases.html"
        class="flex items-center px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-purple-50 dark:hover:bg-gray-800 rounded-lg">
        <i class="fas fa-shopping-cart mr-3"></i>
        Cart
      </a>
      <a href="#"
        class="flex items-center px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-purple-50 dark:hover:bg-gray-800 rounded-lg">
        <i class="fas fa-info-circle mr-3"></i>
        About
      </a>
    </nav>
    <div class="p-4 border-t dark:border-gray-700">
      <button onclick="toggleDarkMode()"
        class="w-full flex items-center px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-purple-50 dark:hover:bg-gray-800 rounded-lg mb-2">
        <i class="fas fa-moon dark:hidden mr-3"></i>
        <i class="fas fa-sun hidden dark:block mr-3"></i>
        Toggle Dark Mode
      </button>
      <a href="../templates/login.html"
        class="w-full flex items-center px-4 py-2 text-white bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 rounded-lg">
        <i class="fas fa-sign-in-alt mr-3"></i>
        Login
      </a>
    </div>
  </div>

  <main class="min-h-screen pt-28 md:pt-24 pb-12 px-4">
    <div class="max-w-md mx-auto">
      <div
        class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm rounded-2xl shadow-xl p-6 sm:p-8 space-y-6 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl border border-gray-100 dark:border-gray-700">
        <div class="text-center space-y-3">
          <h1
            class="text-xl sm:text-2xl md:text-3xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
            Welcome Back</h1>
          <p class="text-gray-600 dark:text-gray-400 text-sm md:text-base">Please enter your details to sign in</p>
        </div>

        <form class="space-y-5" id="loginForm" novalidate>
          <div class="relative group">
            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-purple-600 transition-colors duration-300"
              aria-hidden="true"></i>
            <input type="email" id="username" name="username"
              class="w-full pl-10 pr-4 py-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all duration-300 bg-white/80 dark:bg-gray-700/80 text-gray-900 dark:text-gray-100 text-sm md:text-base"
              placeholder="Email address" autocomplete="email" required aria-label="Email address">
          </div>

          <div class="relative group">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-purple-600 transition-colors duration-300"
              aria-hidden="true"></i>
            <input type="password" id="password" name="password"
              class="w-full pl-10 pr-12 py-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all duration-300 bg-white/80 dark:bg-gray-700/80 text-gray-900 dark:text-gray-100 text-sm md:text-base"
              placeholder="Password" autocomplete="current-password" required minlength="8" aria-label="Password">
            <button type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-600 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-purple-600/20 rounded-lg p-1"
              aria-label="Toggle password visibility">
              <i class="fas fa-eye-slash" aria-hidden="true"></i>
            </button>
          </div>

          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 sm:gap-0">
            <label class="flex items-center space-x-2 text-gray-600 dark:text-gray-400 cursor-pointer group">
              <input type="checkbox" id="remember" name="remember"
                class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 text-purple-600 focus:ring-purple-500/20 transition-colors duration-300">
              <span class="group-hover:text-purple-600 transition-colors duration-300 text-sm md:text-base">Remember
                me</span>
            </label>
            <a href="/forgot-password"
              class="text-purple-600 hover:text-purple-700 font-medium hover:bg-purple-50 dark:hover:bg-gray-700 px-3 py-2 rounded-lg transition-all duration-300 text-sm md:text-base">Forgot
              Password?</a>
          </div>

          <button type="submit"
            class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:from-purple-700 hover:to-blue-700 focus:ring-4 focus:ring-purple-500/50 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 text-sm md:text-base">
            Sign In
          </button>

          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-4 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400">or continue with</span>
            </div>
          </div>

          <button type="button"
            class="w-full flex items-center justify-center space-x-2 border-2 border-gray-200 dark:border-gray-700 rounded-lg py-2.5 px-4 hover:bg-gray-50 dark:hover:bg-gray-700 hover:border-purple-600/20 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 text-sm md:text-base">
            <img src="../images/google.png" class="w-5 h-5 transition-transform group-hover:scale-110" alt=""
              aria-hidden="true">
            <span class="text-gray-700 dark:text-gray-300">Sign in with Google</span>
          </button>

          <p class="text-center text-gray-600 dark:text-gray-400 text-sm md:text-base">
            Don't have an account?
            <a href="/signup"
              class="text-purple-600 font-semibold hover:text-purple-700 hover:bg-purple-50 dark:hover:bg-gray-700 px-3 py-2 rounded-lg ml-1 transition-all duration-300 inline-block">Sign
              up</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <script src="../static/js/login.js" defer></script>
</body>

</html>
